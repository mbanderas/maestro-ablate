    <text x="0" y="112" font-size="112" font-weight="700" letter-spacing="-2">Ablate</text>
    <text x="0" y="182" font-size="34" fill="#9BA3AE">Find out what a skill is actually made of.</text>
    <text x="0" y="244" font-size="34" fill="#9BA3AE">Keep that. Drop the rest.</text>
  </g>

  <g transform="translate(1010 210)">
