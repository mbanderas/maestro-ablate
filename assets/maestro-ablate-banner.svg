<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1774 887" width="1774" height="887" role="img" aria-label="Maestro: Ablate — measure what a skill is actually made of">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D10"/>
      <stop offset="1" stop-color="#15181D"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F59E0B" stop-opacity="0.9"/>
