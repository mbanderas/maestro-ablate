    </linearGradient>
  </defs>

  <rect width="1774" height="887" fill="url(#bg)"/>
  <rect y="884" width="1774" height="3" fill="url(#edge)"/>

  <g transform="translate(120 300)" fill="#F5F6F7" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
